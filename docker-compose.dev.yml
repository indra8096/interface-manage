services:
  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: task-manager-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - task-manager-network

  # Application Next.js (Mode développement)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: task-manager-app-dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://taskuser:taskpass123@db:5432/taskmanager
      NODE_ENV: development
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - db
    networks:
      - task-manager-network
    volumes:
      # Synchronisation en temps réel du code source
      - .:/app
      - /app/node_modules
      - /app/.next
      - ./uploads:/app/uploads
    command: npm run dev

volumes:
  postgres_data:
    driver: local

networks:
  task-manager-network:
    driver: bridge 